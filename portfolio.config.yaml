siteMode: "portfolio"
siteUrl: "https://leoyuedev.github.io"
showPoweredBy: true

# ── i18n ──────────────────────────────────────────────────────────────
defaultLanguage: "en"
languages:
  - { code: "en", label: "English" }
  - { code: "zh", label: "中文" }

# ── Identity (non-translatable) ────────────────────────────────────────
email: "leo.yue.dev@gmail.com"
phone: "(+86)18780534052"
avatarUrl: "https://api.dicebear.com/9.x/fun-emoji/svg?seed=Alex&mouth[]=wideSmile&radius=12"

# ── Status ─────────────────────────────────────────────────────────────
openToWork: false

# ── Theme ──────────────────────────────────────────────────────────────
defaultTheme: "system"
colorPreset: "indigo"

resumeTheme:
  twoColumn: "indigo"
  classic: "emerald"

contactFormEndpoint: ""

# ── Section visibility ─────────────────────────────────────────────────
sections:
  - { id: about,          show: true  }
  - { id: stats,          show: false }
  - { id: skills,         show: true  }
  - { id: languages,      show: true  }
  - { id: experience,     show: true  }
  - { id: projects,       show: true  }
  - { id: education,      show: true  }
  - { id: certifications, show: false  }
  - { id: publications,   show: false }
  - { id: testimonials,   show: false  }
  - { id: contact,        show: true  }

# ── Social links ──────────────────────────────────────────────────────
social:
  github:   "https://github.com/LeoYueDev"
  linkedin: "https://linkedin.com/in/LeoYueDev"
  twitter:  ""
  website:  ""

